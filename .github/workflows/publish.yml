name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Secrets Presence
        run: |
          if [ -z "${{ secrets.MAVEN_CENTRAL_USERNAME }}" ]; then
            echo "❌ Error: MAVEN_CENTRAL_USERNAME secret is missing!"
            exit 1
          fi
          if [ -z "${{ secrets.MAVEN_CENTRAL_PASSWORD }}" ]; then
            echo "❌ Error: MAVEN_CENTRAL_PASSWORD secret is missing!"
            exit 1
          fi
          if [ -z "${{ secrets.SIGNING_KEY_ID }}" ]; then
            echo "❌ Error: SIGNING_KEY_ID secret is missing!"
            exit 1
          fi
          if [ -z "${{ secrets.SIGNING_PASSWORD }}" ]; then
            echo "❌ Error: SIGNING_PASSWORD secret is missing!"
            exit 1
          fi
          if [ -z "${{ secrets.SIGNING_SECRET_KEY }}" ]; then
            echo "❌ Error: SIGNING_SECRET_KEY secret is missing!"
            exit 1
          fi
          echo "✅ All required secrets are present."

      - name: Prepare Signing Keyring File
        run: |
          echo "${{ secrets.SIGNING_SECRET_KEY }}" | base64 --decode > $HOME/secring.gpg

      - name: Publish to Maven Central
        run: |
          ./gradlew publishToMavenCentral \
            --no-configuration-cache \
            --info \
            -PmavenCentralUsername="${{ secrets.MAVEN_CENTRAL_USERNAME }}" \
            -PmavenCentralPassword="${{ secrets.MAVEN_CENTRAL_PASSWORD }}" \
            -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}" \
            -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
            -Psigning.secretKeyRingFile="$HOME/secring.gpg" \
            -Psigning.key="${{ secrets.SIGNING_SECRET_KEY }}"
